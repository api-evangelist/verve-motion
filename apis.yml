aid: verve-motion
name: Verve Motion
description: >-
  Verve Motion is a wearable robotics company spun out of the Harvard Biodesign Lab that builds
  SafeLift, a soft powered exosuit for industrial workers who lift repetitively. Inertial sensors
  woven into the suit detect lifting motion and trigger assistive force that the company says takes
  up to 40% of the strain off a worker's back, while Verve Logic — its cloud platform — collects the
  resulting movement data and reports ergonomic risk, unsafe-posture trends and exosuit utilization
  to safety managers. SafeLift is sold as a subscription bundling the exosuit, the Verve Logic data
  portal and Verve Care support, and is distributed in part through partners such as HexArmor. Verve
  Motion publishes no public developer program, API reference or machine-readable specification; the
  Verve Logic portal at logic.vervemotion.com is a customer-only single-page application that
  disallows crawling in robots.txt.
